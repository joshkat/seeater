# static-web-server config for the production image (see ../Dockerfile).
# https://static-web-server.net/configuration/config-file/

[general]
host = "0.0.0.0"
port = 8080
root = "/public"
log-level = "warn"

# gzip / brotli / zstd on the fly, so the image ships no pre-compressed copies.
compression = true

# Client-side routes (/events/:id, /trash…) get the app shell.
page-fallback = "/public/index.html"

# We set Cache-Control ourselves below.
cache-control-headers = false
security-headers = true
directory-listing = false

[advanced]

# Hashed build output never changes under the same name.
[[advanced.headers]]
source = "/assets/**"
[advanced.headers.headers]
Cache-Control = "public, max-age=31536000, immutable"

# Everything that decides which build the browser runs must be revalidated, so
# a redeploy shows up on the next load.
[[advanced.headers]]
source = "/{,index.html,sw.js,registerSW.js,manifest.webmanifest}"
[advanced.headers.headers]
Cache-Control = "no-cache"
